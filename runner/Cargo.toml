[package]
name = "runner"
version = "0.1.0"
edition = "2024"

[dependencies]

clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
anyhow = "1.0.104"
iroh-blobs = { version = "0.104.0", default-features = false, features = [
    "fs-store",
] }
tokio = { version = "1.54.1", features = ["full"] }
axum = "0.8.9"
n0-future = "0.3.2"

tracing-subscriber = "0.3.23"
tracing = "0.1.44"

# wash-runtime = { git = "https://github.com/wasmCloud/wasmCloud", tag = "v2.11.0", default-features = false, features = [
#     "wasi-keyvalue",
#     "wasi-config",
#     "wasi-logging",
#     "wasi-blobstore",
# ] }

wash-runtime = { path = "..\\..\\wasmCloud\\crates\\wash-runtime", default-features = false, features = [
    "wasi-keyvalue",
    "wasi-config",
    "wasi-logging",
    "wasi-blobstore",
] }

wasmtime = { version = "48.0.8", default-features = false }
wasmtime-wasi = { version = "48.0.8", default-features = false }
wasmtime-wasi-io = { version = "48.0.8", default-features = false }
wasmtime-wasi-http = { version = "48.0.8", default-features = false }
wasmtime-wasi-tls = { version = "48.0.8", default-features = false }

uuid = { version = "1.29.0", features = ["v4", "v7"] }
async-trait = "0.1.92"
hyper = "1.12.0"
bytes = "1.12.1"
